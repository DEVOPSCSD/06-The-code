services:
  backend:
    build:
      context: ./backend
    container_name: food-ordering-backend-jenkins
    restart: unless-stopped
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: food_ordering
      PORT: 5000
    ports:
      - "5002:5000"